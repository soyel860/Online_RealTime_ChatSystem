<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | ChatAv</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #6c5ce7;
            --primary-dark: #5649c0;
            --secondary: #00cec9;
            --accent: #fd79a8;
            --white: #ffffff;
            --light: #f8f9fa;
            --dark: #2d3436;
            --glass: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.2);
            --gold: #FFD700;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            /* background: linear-gradient(135deg, var(--primary), var(--secondary));/ */
            background-color: #6c5ce7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
            scroll-behavior: smooth;
        }

        .luxury-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .luxury-bg::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            opacity: 0.15;
            filter: blur(2px);
        }

        .diamond {
            position: absolute;
            width: 10px;
            height: 10px;
            background: var(--white);
            transform: rotate(45deg);
            opacity: 0.6;
            animation: float 15s linear infinite;
        }

        .signup-container {
            background: var(--glass);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            width: 100%;
            max-width: 500px;
            padding: 40px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .signup-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0) 70%);
            z-index: -1;
            animation: rotate 20s linear infinite;
        }

        .signup-header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
        }

        .signup-header h2 {
            color: var(--white);
            font-size: 2.5rem;
            margin-bottom: 15px;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(to right, var(--white), var(--gold));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .signup-header p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1rem;
            font-weight: 300;
        }

        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.9rem;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .form-group input, 
        .form-group select {
            width: 100%;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            font-size: 1rem;
            color: var(--white);
            transition: all 0.3s ease;
        }

        .form-group input::placeholder,
        .form-group select option:first-child {
            color: rgba(255, 255, 255, 0.5);
        }

        .form-group select option {
            color: var(--dark);
        }

        .form-group input:focus,
        .form-group select:focus {
            background: rgba(255, 255, 255, 0.2);
            border-color: var(--accent);
            outline: none;
            box-shadow: 0 0 0 3px rgba(253, 121, 168, 0.3);
        }

        .form-group .password-toggle {
            position: absolute;
            right: 20px;
            top: 45px;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.7);
            transition: all 0.3s ease;
        }

        .form-group .password-toggle:hover {
            color: var(--white);
            transform: scale(1.1);
        }

        .profile-picture {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
            position: relative;
        }

        .profile-picture-preview {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-bottom: 15px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
            position: relative;
        }

        .profile-picture-preview:hover {
            transform: scale(1.05);
            border-color: var(--accent);
        }

        .profile-picture-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .profile-picture-preview span {
            color: rgba(255, 255, 255, 0.5);
            font-size: 50px;
            transition: all 0.3s ease;
        }

        .profile-picture-preview:hover span {
            color: var(--accent);
        }

        .profile-picture input {
            display: none;
        }

        .profile-picture label {
            color: var(--gold);
            cursor: pointer;
            font-weight: 500;
            font-size: 1rem;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .profile-picture label:hover {
            color: var(--white);
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .profile-picture label i {
            font-size: 1.2rem;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(45deg, var(--primary), var(--accent));
            color: var(--white);
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            margin-top: 20px;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: 0.5s;
        }

        .submit-btn:hover::before {
            left: 100%;
        }

        .login-link {
            text-align: center;
            margin-top: 30px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
        }

        .login-link a {
            color: var(--gold);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .login-link a:hover {
            color: var(--white);
            text-decoration: underline;
        }

        .error-message {
            color: #ff6b6b;
            font-size: 0.8rem;
            margin-top: 8px;
            display: none;
            font-weight: 400;
        }

        .gold-border {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            animation: borderGlow 3s infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-1000px) rotate(720deg);
                opacity: 0;
            }
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes borderGlow {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        @media (max-width: 768px) {
            .signup-container {
                padding: 30px;
                margin: 20px;
            }


            .signup-header h2 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="luxury-bg" id="luxuryBg"></div>
    
    <div class="signup-container">
        <div class="gold-border"></div>
        <div class="signup-header">
            <h2>Join ChatAv</h2>
            <p>Create your premium account</p>
        </div>

        <form id="signupForm" enctype="multipart/form-data">
            <div class="profile-picture">
                <div class="profile-picture-preview" id="profilePreview">
                    <span><i class="fas fa-user-circle"></i></span>
                    <img id="profileImage" src="#" alt="Profile Preview">
                </div>
                <label for="profileInput">
                    <i class="fas fa-camera"></i> Upload Profile
                </label>
                <input type="file" id="profileInput" name="profileImage" accept="image/*">
            </div>

            <div class="form-group">
                <label for="username">Profile Name</label>
                <input type="text" id="username" name="username" placeholder="Enter your name" required>
                <div class="error-message" id="name-error">Please enter your name</div>
            </div>

            <div class="form-group">
                <label for="email">Email or Mobile</label>
                <input type="text" id="email" name="email" placeholder="Enter email or mobile number" required>
                <div class="error-message" id="email-error">Please enter a valid email or mobile number</div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Create a password" required>
                <span class="password-toggle" id="togglePassword"><i class="far fa-eye"></i></span>
                <div class="error-message" id="password-error">Password must be at least 6 characters</div>
            </div>

            <div class="form-group">
                <label for="age">Age</label>
                <input type="number" id="age" name="age" placeholder="Enter your age" min="13" max="120" required>
                <div class="error-message" id="age-error">Please enter a valid age (13-120)</div>
            </div>

            <div class="form-group">
                <label for="gender">Gender</label>
                <select id="gender" name="gender" required>
                    <option value="" disabled selected>Select your gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                    <option value="prefer-not-to-say">Prefer not to say</option>
                </select>
            </div>

            <button type="submit" class="submit-btn">CREATE ACCOUNT</button>
        </form>

        <div class="login-link">
            Already have an account? <a href="/login">Login</a>
        </div>
    </div>

    <script>

        // const API_BASE_URL = window.location.hostname === 'localhost' ? 'http://localhost:3000' : `http://${window.location.hostname}:3000`;
        const API_BASE_URL = window.location.origin;
        document.addEventListener('DOMContentLoaded', function() {
            const luxuryBg = document.getElementById('luxuryBg');
            const diamondsCount = 15;
            
            for (let i = 0; i < diamondsCount; i++) {
                const diamond = document.createElement('div');
                diamond.classList.add('diamond');
                
                const size = Math.random() * 10 + 5;
                diamond.style.width = `${size}px`;
                diamond.style.height = `${size}px`;
                
                diamond.style.left = `${Math.random() * 100}%`;
                diamond.style.bottom = `-${size}px`;
                
                const duration = Math.random() * 15 + 10;
                diamond.style.animationDuration = `${duration}s`;
                
                diamond.style.animationDelay = `${Math.random() * 5}s`;
                
                luxuryBg.appendChild(diamond);
            }
        });

        const togglePassword = document.getElementById('togglePassword');
        const password = document.getElementById('password');

        togglePassword.addEventListener('click', function() {
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            this.innerHTML = type === 'password' ? '<i class="far fa-eye"></i>' : '<i class="far fa-eye-slash"></i>';
        });

        const profileInput = document.getElementById('profileInput');
        const profilePreview = document.getElementById('profilePreview');
        const profileImage = document.getElementById('profileImage');

        profileInput.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    profileImage.src = e.target.result;
                    profileImage.style.display = 'block';
                    profilePreview.querySelector('span').style.display = 'none';
                }
                reader.readAsDataURL(file);
            }
        });

        const signupForm = document.getElementById('signupForm');
        const nameError = document.getElementById('name-error');
        const emailError = document.getElementById('email-error');
        const passwordError = document.getElementById('password-error');
        const ageError = document.getElementById('age-error');

        signupForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            nameError.style.display = 'none';
            emailError.style.display = 'none';
            passwordError.style.display = 'none';
            ageError.style.display = 'none';

            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const passwordValue = document.getElementById('password').value;
            const age = document.getElementById('age').value;
            const gender = document.getElementById('gender').value;

            if (username.trim() === '') {
                nameError.style.display = 'block';
                return;
            }

            if (!validateEmailOrPhone(email)) {
                emailError.style.display = 'block';
                return;
            }

            if (passwordValue.length < 6) {
                passwordError.style.display = 'block';
                return;
            }

            if (age < 13 || age > 120) {
                ageError.style.display = 'block';
                return;
            }

            if (gender === "") {
                alert('Please select gender!');
                return;
            }

            const formData = new FormData();
            formData.append('name', username);
            formData.append('contract', email);
            formData.append('password', passwordValue);
            formData.append('age', age);
            formData.append('gender', gender);
            
            const fileInput = document.getElementById('profileInput');
            if (fileInput.files[0]) {
                formData.append('profileImage', fileInput.files[0]);
            }

            try {
                const response = await fetch(`${API_BASE_URL}/signup`, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    alert(data.message);
                    window.location.href = data.redirect;
                } else {
                    alert(data.message || 'Signup failed! Try again.');
                }
            } catch (err) {
                console.error(err);
                alert('Error during signup. Please try again.');
            }
        });

        function validateEmailOrPhone(input) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            const phoneRegex = /^[0-9]{10,15}$/;
            return emailRegex.test(input) || phoneRegex.test(input);
        }
    </script>
</body>
</html>
